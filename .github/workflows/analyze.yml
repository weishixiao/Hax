name: Dart Analyze

# 手动 / PR 触发的轻量静态检查（不做多平台打包）
on:
  workflow_dispatch:
  push:
    branches: ['feat/**', 'fix/**']
  pull_request:
    branches: [master]

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Flutter pub get (markstream)
        working-directory: dependencies/markstream
        run: flutter pub get --enforce-lockfile

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Flutter analyze
        # 只分析应用代码：dependencies/ 下的子包有各自的依赖，不能在这里分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
